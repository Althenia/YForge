[package]
name = "yforge-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring = "4.2.0"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
yforge-core = { version = "0.3.0", path = "../yforge-core" }

[dev-dependencies]
tempfile = "3.27.0"
