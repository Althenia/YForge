<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YForge specimen · 14 application settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../specimen.css">
<style>
.app { grid-template-rows: 40px 1fr; }
.icon-btn.on { background: var(--control-hover); color: var(--green-strong); box-shadow: inset 0 0 0 1px var(--line-strong); }
.settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 10px; padding: 2px 10px 10px; min-height: 0; }
.nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
.nav h2 { margin: 0; padding: 4px 8px 10px; font: 600 16px/22px var(--sans); letter-spacing: -0.01em; }
.nrow { position: relative; min-height: 28px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 4px 8px 4px 14px; border-radius: var(--r-sm); font: 400 13px/20px var(--sans); }
.nrow.sel { background: var(--selection); font-weight: 500; }
.nrow.sel::before { content: ""; position: absolute; left: 3px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--green-strong); }
.nrow .chip { flex: none; }
.content { padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.search { width: 280px; justify-content: flex-start; gap: 8px; color: var(--muted); }
.search .kbd { margin-left: auto; }
.section { max-width: 760px; width: 100%; }
.section h1 { margin: 0 0 4px; font: 600 20px/26px var(--sans); }
.section > p { margin: 0 0 8px; color: var(--muted); }
.setting { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .name { font: 500 13px/20px var(--sans); }
.setting .desc { font: 400 12px/16px var(--sans); color: var(--muted); margin-top: 2px; }
.control { display: flex; align-items: center; gap: 12px; }
.stepper { display: inline-flex; align-items: center; height: 32px; border-radius: var(--r-md); background: var(--control); box-shadow: inset 0 0 0 1px var(--border-strong); }
.stepper .step { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); font: 500 16px/1 var(--sans); }
.stepper .val { min-width: 56px; text-align: center; font: 500 12px/16px var(--mono); }
.select { min-width: 220px; justify-content: space-between; align-items: center; font: 400 12px/20px var(--mono); }
.select svg { color: var(--muted); }
.preview { display: flex; align-items: baseline; gap: 8px; font: 400 12px/16px var(--sans); color: var(--muted); }
.preview .mono { color: var(--text); }
.setting.tight { grid-template-columns: minmax(0, 1fr) auto; padding: 8px 0; border-bottom: 0; }
.diag { display: grid; gap: 6px; margin-top: 10px; }
.diag h2 { margin: 0; font: 600 14px/20px var(--sans); }
.dhead { display: flex; align-items: center; gap: 8px; }
.dhead .note { flex: 1; font: 400 12px/16px var(--sans); color: var(--muted); }
.dhead .btn { height: 24px; padding: 0 10px; font-size: 12px; }
.rows { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.arow { display: flex; align-items: center; gap: 12px; min-height: 28px; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); font: 400 13px/20px var(--sans); }
.arow .st { display: inline-flex; color: var(--green-strong); }
.arow .st.bad { color: var(--danger-ink); }
.arow .op { font-weight: 600; }
.arow .sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.arow .time { font: 400 12px/16px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.arow .chip { height: 20px; padding: 0 8px; font-size: 11px; }
.state { font: 500 13px/20px var(--sans); }
</style>
</head>
<body>
<script src="../specimen.js"></script>
<script>
const I = YF.icon;
const tabs = YF.tabs().replace('class="icon-btn" aria-label="Settings"', 'class="icon-btn on" aria-current="page" aria-label="Settings"');
const navIcons = { General: "settings", Git: "branch", Appearance: "theme", Platforms: "plug" };
const git = YF.flags.has("git");
const platforms = YF.flags.has("platforms");
const privacy = !YF.flags.has("appearance") && !git && !platforms;
const navGlyph = (name) => name === "Privacy &amp; diagnostics" ? YF.icon.lock : navIcons[name] ? YF.glyph(navIcons[name]) : "";
const nav = (name, cls = "", extra = "") => `<div class="nrow${cls}"><span class="icon-slot">${navGlyph(name)}</span>${name}${extra}</div>`;
const ok = `<span class="st">${YF.glyph("check", 14)}</span>`;
const bad = `<span class="st bad">${YF.glyph("warning", 14)}</span>`;
const usageRow = (stamp, op, outcome, meta, mark = ok) => `<li class="arow">${mark}<span class="time">${stamp}</span><span class="op">${op}</span><span class="sum">${outcome}</span><span class="time">${meta}</span></li>`;
const crashRow = (stamp, origin, kind, message) => `<li class="arow"><span class="time">${stamp}</span><span class="chip">${origin}</span><span class="op">${kind}</span><span class="sum">${message}</span></li>`;
const historyRow = (stamp, op, summary, earlier) => `<li class="arow">${ok}<span class="op">${op}</span><span class="sum">${summary}</span>${earlier ? '<span class="chip">Earlier session — no undo</span>' : '<span class="chip ok">Undo available</span>'}<span class="time">${stamp}</span></li>`;
const privacySection = `
      <section class="section" aria-labelledby="privacy">
        <h1 id="privacy">Privacy &amp; diagnostics</h1>
        <p>Everything on this page is stored on this Mac. Nothing is sent anywhere.</p>
        <div class="diag" aria-label="Usage data">
          <h2>Usage data</h2>
          <div class="setting tight"><div><div class="name">Record usage data</div><div class="desc">When on, YForge records for each Git operation its type, whether it succeeded (and the error kind if not), how long it took, and how many Git commands it ran, with the time and app version. Paths, branch names, and messages are never recorded, and nothing leaves this Mac. Turning it off deletes the stored events.</div></div>
            <div class="control"><span class="switch on" role="switch" aria-checked="true" aria-label="Record usage data"></span><span class="state">On</span></div></div>
          <div class="dhead"><span class="note">Stored on this Mac, newest first.</span><span class="btn sm">Export…</span><span class="btn sm">${YF.glyph("trash", 14)}Delete all</span></div>
          <ul class="rows" aria-label="Usage events">
            ${usageRow("30 Sep 2026 15:02", "Stage all", "succeeded", "12 ms · 2 commands")}
            ${usageRow("30 Sep 2026 14:58", "Push", "failed (push rejected)", "1.5 s · 1 command", bad)}
            ${usageRow("30 Sep 2026 14:41", "Commit", "succeeded", "84 ms · 3 commands")}
          </ul>
        </div>
        <div class="diag" aria-label="Crash reports">
          <h2>Crash reports</h2>
          <div class="dhead"><span class="note">Errors and panics, stored on this Mac and never sent. Newest first.</span><span class="btn sm">Export…</span><span class="btn sm">${YF.glyph("trash", 14)}Clear</span></div>
          <ul class="rows" aria-label="Crash reports">
            ${crashRow("29 Sep 2026 22:14", "frontend", "render", "Cannot read properties of undefined (reading 'sha')")}
            ${crashRow("27 Sep 2026 09:30", "rust", "panic", "index out of bounds: the len is 3 but the index is 7")}
          </ul>
        </div>
        <div class="diag" aria-label="Activity history">
          <h2>Activity history</h2>
          <div class="dhead"><span class="note">Operations run in sample, newest first. Undo only reaches the current session.</span><span class="btn sm">${YF.glyph("trash", 14)}Clear history</span></div>
          <ul class="rows" aria-label="Activity history">
            ${historyRow("15:02", "stage_all", "Staged all changes", false)}
            ${historyRow("29 Sep 2026 18:20", "commit", "Committed “Fix greeting”", true)}
          </ul>
        </div>
      </section>`;

const platformRow = (icon, name, kind, host, { chip = "", result = "" } = {}) => `<li class="platform-row"><span class="tile">${YF.glyph(icon)}</span><span class="pname"><strong>${name}</strong><span>${kind} · <span class="mono">${host}</span></span></span>${chip}<span class="control"><span class="btn sm">${YF.glyph("sync", 14)}Test</span>${YF.iconBtn("edit", `Edit ${name}`)}${YF.iconBtn("trash", `Remove ${name}`)}</span>${result}</li>`;
const platformsSection = `
      <section class="section" aria-labelledby="platforms">
        <h1 id="platforms">Platforms</h1>
        <p>Connect GitHub, GitLab, or Bitbucket to list, create, and merge pull requests for repositories cloned from that host. Tokens stay in the macOS Keychain; Git itself keeps using your SSH keys and credentials.</p>
        <div class="dhead"><h2 style="margin:0;font:600 14px/20px var(--sans)">Connections</h2><span class="note"></span><span class="btn">${YF.glyph("plus")}Add connection</span></div>
        <ul class="rows" aria-label="Platform connections" style="margin-top:8px">
          ${platformRow("github", "GitHub", "GitHub", "github.com", { result: `<span class="presult"><span class="chip ok">${YF.glyph("check", 14)}Connected as yui</span></span>` })}
          ${platformRow("gitlab", "Work GitLab", "GitLab", "git.example.com:8443", { chip: `<span class="chip attn">${YF.glyph("warning", 14)}Certificate not checked</span>`, result: `<span class="presult bad">${YF.glyph("warning", 14)}Authentication failed for git.example.com:8443<span class="btn sm">Edit connection</span></span>` })}
          ${platformRow("bitbucket", "Bitbucket", "Bitbucket", "bitbucket.org")}
        </ul>
        <p style="margin-top:12px;font:400 12px/16px var(--sans)">GitHub, GitLab, and Bitbucket are named only to say which service a connection reaches; YForge is not affiliated with them.</p>
      </section>`;
const html = `
<div class="app">
  ${tabs}
  <div class="settings">
    <nav class="panel nav" aria-label="Settings sections">
      <h2>Settings</h2>
      ${nav("General")}${nav("Git", git ? " sel" : "")}${nav("Accounts &amp; authentication")}${nav("Appearance", privacy || git || platforms ? "" : " sel")}${nav("Privacy &amp; diagnostics", privacy ? " sel" : "")}${nav("Diff &amp; merge")}${nav("Keyboard")}${nav("Platforms", platforms ? " sel" : "")}${nav("Advanced")}
    </nav>
    <main class="panel content">
      <div class="topline">
        <span class="seg" role="tablist" aria-label="Scope"><span class="on" role="tab" aria-selected="true">All repositories</span><span role="tab">This repository: sample</span></span>
        <div class="input search">${I.search}<span class="ph">Search settings</span><span class="kbd">⌘F</span></div>
      </div>
      ${platforms ? platformsSection : ""}
      ${privacy ? privacySection : ""}
      ${git ? `<section class="section" aria-labelledby="ssh">
        <h1 id="ssh">SSH</h1>
        <p>Applies to every repository that has no key of its own.</p>
        <div class="setting"><div><div class="name">SSH key</div><div class="desc">Key used for every repository that has no key of its own. Leave it on ssh-agent to use the agent and your default keys.</div></div>
          <div class="control"><div class="input select"><span>id_ed25519 · ssh-ed25519</span>${I.chevron}</div><span class="btn sm">Browse…</span></div></div>
        <div class="setting"><div><div class="name">Listed keys</div><div class="desc">Private keys in ~/.ssh that have a matching .pub file.</div></div>
          <div class="control"><span class="chip"><span class="ref">ssh-agent (default)</span></span><span class="chip"><span class="ref">id_ed25519</span> ssh-ed25519</span><span class="chip"><span class="ref">work</span> ssh-rsa</span></div></div>
      </section>` : ""}
      ${privacy || git || platforms ? "" : `<section class="section" aria-labelledby="appearance">
        <h1 id="appearance">Appearance</h1>
        <p>Applies to every repository.</p>
        <div class="setting"><div><div class="name">Theme</div><div class="desc">Dark, light, or follow the system.</div></div>
          <div class="control"><span class="seg"><span class="${YF.theme === "light" ? "on" : ""}">Light</span><span class="${YF.theme === "dark" ? "on" : ""}">Dark</span><span>System</span></span></div></div>
        <div class="setting"><div><div class="name">Density</div><div class="desc">Compact graph lanes are 10px apart; default lanes are 22px.</div></div>
          <div class="control"><span class="seg"><span>Compact</span><span class="on">Default</span></span></div></div>
        <div class="setting"><div><div class="name">UI font size</div><div class="desc">Size of interface text.</div></div>
          <div class="control"><span class="stepper" role="group" aria-label="UI font size"><span class="step" aria-label="Decrease">−</span><span class="val">13 px</span><span class="step" aria-label="Increase">+</span></span></div></div>
        <div class="setting"><div><div class="name">Code font size</div><div class="desc">Size of diffs, paths, and commands.</div></div>
          <div class="control"><span class="stepper" role="group" aria-label="Code font size"><span class="step" aria-label="Decrease">−</span><span class="val">12 px</span><span class="step" aria-label="Increase">+</span></span></div></div>
        <div class="setting"><div><div class="name">Date format</div><div class="desc">How commit dates are written.</div></div>
          <div class="control"><div class="input select"><span>D MMM YYYY HH:mm</span>${I.chevron}</div><span class="preview">Preview <span class="mono">29 Sep 2026 16:29</span></span></div></div>
        <div class="setting"><div><div class="name">Reduce motion follows system</div><div class="desc">Stops the aurora drift and makes transitions instant.</div></div>
          <div class="control"><span class="switch on" role="switch" aria-checked="true" aria-label="Reduce motion follows system"></span></div></div>
      </section>`}
    </main>
  </div>
</div>`;
document.body.insertAdjacentHTML("afterbegin", YF.aurora() + html);
YF.boot("screen 14 · application settings");
</script>
</body>
</html>
