<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YForge specimen · diff viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../specimen.css">
<style>
.dpanel { background: var(--glass-graph); --canvas: var(--graph-bg); display: grid; grid-template-rows: 44px auto 1fr; }
.dhead, .dtool { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.dtool { gap: 8px; padding-left: 12px; min-height: 44px; flex-wrap: wrap; row-gap: 4px; white-space: nowrap; }
.crumbs { display: flex; align-items: center; gap: 6px; font: 400 12px/16px var(--sans); color: var(--muted); white-space: nowrap; min-width: 0; }
.crumbs .path { font: 500 12px/16px var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.dtool .seg span { padding: 0 10px; }
.dtool .icon-btn { width: 26px; height: 26px; }
.dnav { display: inline-flex; align-items: center; gap: 4px; margin-left: auto; }
.dbody { padding: 12px; overflow: auto; min-height: 0; }
.dbody .hunk:last-child { margin-bottom: 0; }
.frow.sel { position: relative; background: var(--selection); }
.frow.sel::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--green-strong); }
.frow .dir { color: var(--muted); }
.hunk-head .range { font: 400 12px/18px var(--mono); }
</style>
</head>
<body>
<script src="../specimen.js"></script>
<script>
const I = YF.icon;
const split = YF.flags.has("split");
const k = (t) => `<span class="syn-keyword">${t}</span>`;
const n = (t) => `<span class="syn-number">${t}</span>`;
const f = (t) => `<span class="syn-function">${t}</span>`;
const ty = (t) => `<span class="syn-type">${t}</span>`;
const w = (t) => `<span class="word">${t}</span>`;
const wn = (t) => `<span class="word syn-number">${t}</span>`;
const check = YF.glyph("check", 14);

const lines = [
  { o: 3, n: 3, code: `${k("import")} { sleep } ${k("from")} <span class="syn-string">"./time"</span>;` },
  { o: 4, n: 4, code: "" },
  { kind: "del", o: 5, code: `${k("export")} ${k("const")} DEFAULT_RETRIES = ${wn(3)};`, sel: true },
  { kind: "add", n: 5, code: `${k("export")} ${k("const")} DEFAULT_RETRIES = ${wn(5)};`, sel: true },
  { kind: "add", n: 6, code: `${k("export")} ${k("const")} MAX_DELAY_MS = ${n(4000)};` },
  { o: 6, n: 7, code: "" },
  { o: 7, n: 8, code: `${k("export")} ${k("function")} ${f("clamp")}(value: ${ty("number")}, min: ${ty("number")}, max: ${ty("number")}) {` },
  { kind: "del", o: 8, code: `  ${k("return")} Math.${f("min")}(Math.${f("max")}(value, min), max);` },
  { kind: "add", n: 9, code: `  ${k("return")} Math.${f("max")}(min, Math.${f("min")}(value, max));` },
  { o: 9, n: 10, code: "}" },
];
const mark = (l) => (l.sel ? check : l.kind === "add" ? "+" : l.kind === "del" ? "−" : "");
const gutter = (l) => {
  const label = l.kind ? `Select ${l.kind === "add" ? "added" : "removed"} line ${l.kind === "add" ? l.n : l.o}` : "";
  const inner = `<span class="ln">${l.o ?? ""}</span><span class="ln">${l.n ?? ""}</span><span class="mk">${mark(l)}</span>`;
  return l.kind ? `<span class="gut pick" role="checkbox" aria-checked="${!!l.sel}" aria-label="${label}">${inner}</span>` : `<span class="gut">${inner}</span>`;
};
const unified = (l) => `<div class="dline${l.kind ? " " + l.kind : ""}${l.sel ? " sel" : ""}">${gutter(l)}<span class="code">${l.code}</span></div>`;

const half = (l, side) => {
  if (!l) return `<div class="half ${side} blank"></div>`;
  const num = side === "old" ? l.o : l.n;
  const kind = l.kind ? ` ${l.kind}` : "";
  const label = l.kind ? `Select ${l.kind === "add" ? "added" : "removed"} line ${num}` : "";
  const inner = `<span class="ln">${num ?? ""}</span><span class="mk">${mark(l)}</span>`;
  const g = l.kind ? `<span class="gut pick" role="checkbox" aria-checked="${!!l.sel}" aria-label="${label}">${inner}</span>` : `<span class="gut">${inner}</span>`;
  return `<div class="half ${side}${kind}${l.sel ? " sel" : ""}">${g}<span class="code">${l.code}</span></div>`;
};
const pairRow = (left, right) => `<div class="dsplit">${half(left, "old")}${half(right, "new")}</div>`;
const splitRows = () => [
  pairRow(lines[0], lines[0]),
  pairRow(lines[1], lines[1]),
  pairRow(lines[2], lines[3]),
  pairRow(undefined, lines[4]),
  pairRow(lines[5], lines[5]),
  pairRow(lines[6], lines[6]),
  pairRow(lines[7], lines[8]),
  pairRow(lines[9], lines[9]),
].join("");

const hunkActions = `${YF.iconBtn("plus", "Stage hunk")}<span class="btn sm text-danger">${YF.glyph("trash", 14)}Discard hunk</span>`;
const hunk1 = `<section class="hunk diff" aria-label="Hunk 1 of 2, lines 3–10">
  <div class="hunk-head"><span class="range">@@ -3,7 +3,8 @@</span><span class="spacer"></span>${hunkActions}</div>
  ${split ? splitRows() : lines.map(unified).join("")}
</section>`;

const tail = (kind, o, nn, code) => ({ kind, o, n: nn, code });
const hunk2Lines = [
  { o: 23, n: 24, code: "}" },
  { o: 24, n: 25, code: "" },
  { o: 25, n: 26, code: `${k("export")} ${k("function")} ${f("slugify")}(text: ${ty("string")}) {` },
  { kind: "del", o: 26, code: `  ${k("return")} text.${f("toLowerCase")}().${f("replace")}(<span class="syn-string">/[^a-z0-9]+/g</span>, <span class="syn-string">"-"</span>);` },
  { kind: "add", n: 27, code: `  ${k("return")} text${w(`.${f("trim")}()`)}.${f("toLowerCase")}().${f("replace")}(<span class="syn-string">/[^a-z0-9]+/g</span>, <span class="syn-string">"-"</span>);` },
  { o: 27, n: 28, code: "}" },
];
const hunk2 = `<section class="hunk diff" aria-label="Hunk 2 of 2, lines 24–29">
  <div class="hunk-head"><span class="range">@@ -23,6 +24,6 @@</span><span class="spacer"></span>${hunkActions}</div>
  ${split
    ? [pairRow(hunk2Lines[0], hunk2Lines[0]), pairRow(hunk2Lines[1], hunk2Lines[1]), pairRow(hunk2Lines[2], hunk2Lines[2]), pairRow(hunk2Lines[3], hunk2Lines[4]), pairRow(hunk2Lines[5], hunk2Lines[5])].join("")
    : hunk2Lines.map(unified).join("")}
</section>`;

const diffPanel = `<section class="panel dpanel" aria-label="Diff">
  <div class="dhead"><nav class="crumbs" aria-label="Breadcrumb"><span>Graph</span><span>›</span><span>Changes</span><span>›</span><span class="path">src/util.ts</span></nav><span class="spacer"></span><span class="chip">Unstaged</span></div>
  <div class="dtool" role="toolbar" aria-label="Diff options">
    <span class="seg"><span${split ? "" : ' class="on"'}>Hunk</span><span>Inline</span><span${split ? ' class="on"' : ""}>Split</span></span>
    <span class="dws"><span class="switch"></span>Ignore whitespace</span>
    <span class="dsel" role="group" aria-label="Selected lines"><span class="count">2 lines selected</span>${YF.iconBtn("plus", "Stage lines")}<span class="btn sm text-danger">${YF.glyph("trash", 14)}Discard lines</span>${YF.iconBtn("close", "Clear selection")}</span>
    <span class="dnav">${YF.iconBtn("previous", "Previous hunk")}${YF.iconBtn("next", "Next hunk")}${YF.iconBtn("edit", "Open in editor")}</span>
  </div>
  <div class="dbody">${hunk1}${hunk2}</div>
</section>`;

const inspector = `<aside class="panel inspector" aria-label="Changes">
  <div class="ihead"><h2>${YF.glyph("changes")}Changes</h2><p>on <span class="ref">feature/greeting</span> · 2 files</p></div>
  <div class="ilist">
    ${YF.lhead("changes", "Unstaged · 2", { icon: "plus", label: "Stage all" })}
    <div class="frow sel"><span class="badge st-M">M</span><span><span class="dir">src/</span>util.ts</span>${YF.acts("stage")}</div>
    <div class="frow"><span class="badge st-U">U</span><span><span class="dir">notes/</span>todo.md</span></div>
    ${YF.lhead("check", "Staged · 0")}
    <div class="empty">Nothing staged. Stage files, hunks, or lines to commit them.</div>
  </div>
  <div class="composer">
    <div class="input"><span class="ph">Summary</span><span class="count">72</span></div>
    <div class="input area"><span class="ph">Description</span></div>
    <div class="hrow"><span class="split"><span class="btn primary disabled" aria-disabled="true">${YF.glyph("commit")}Commit</span><span class="btn primary disabled" aria-disabled="true">${I.chevron}</span></span><span class="reason">Stage files to commit</span></div>
  </div>
</aside>`;

document.body.insertAdjacentHTML("afterbegin", YF.aurora() + `<div class="app">${YF.tabs()}${YF.command()}${YF.strip()}<div class="main">${YF.sidebar()}${diffPanel}${inspector}</div>${YF.activity()}</div>`);
YF.boot("screen 4 · diff viewer");
</script>
</body>
</html>
