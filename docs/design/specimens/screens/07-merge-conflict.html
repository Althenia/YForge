<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YForge specimen · merge conflict</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../specimen.css">
<style>
.input.mtext { display: block; min-height: 56px; }
.composer .reason { margin-top: -2px; }
</style>
</head>
<body>
<script src="../specimen.js"></script>
<script>
const banner = `<div class="banner op" role="group" aria-label="Merge in progress"><span>Merging <span class="ref">origin/main</span> into <span class="ref">main</span> · <span class="st st-C">! 1 conflict</span> · your changes are stashed and will be restored</span><span class="spacer"></span><span class="btn primary">Resolve</span><span class="btn danger">Abort merge</span></div>`;

const inspector = `<aside class="panel inspector" aria-label="Merge in progress">
  <div class="ihead"><h2>Merge in progress</h2><p><span class="ref">origin/main</span> into <span class="ref">main</span></p></div>
  <div class="ilist">
    ${YF.lhead("warning", "Conflicted · 1")}
    <div class="frow focus"><span class="badge st-C">!</span><span>README.md</span>${YF.acts("conflict")}</div>
    ${YF.lhead("check", "Resolved · 0")}
    <div class="empty">No files resolved yet.</div>
  </div>
  <div class="composer">
    <div class="field"><label>Message</label><div class="input mtext">Merge remote-tracking branch 'origin/main'</div></div>
    <div class="hrow"><span class="btn disabled" aria-disabled="true">Complete merge</span><span class="spacer"></span><span class="btn danger">Abort merge</span></div>
    <div class="reason">Resolve 1 conflict first</div>
  </div>
</aside>`;

const sidebar = `<aside class="panel sidebar" aria-label="Repository">
  ${YF.sec("changes", "Changes", 1)}
  ${YF.sec("branch", "Branches", 7)}
  <div class="srow current">main <span class="meta up">↑3 · HEAD</span></div>
  <div class="srow folder">bugfix/</div><div class="srow child">header</div>
  <div class="srow folder">feature/</div><div class="srow child">greeting <span class="meta up">↑2</span></div><div class="srow child">inline-branch</div><div class="srow child">login</div><div class="srow child">search <span class="meta">↓1</span></div>
  ${YF.sec("remote", "Remotes", 5)}
  ${YF.sec("tag", "Tags", 3)}
  ${YF.sec("stash", "Stashes", 2)}
  ${YF.sec("worktree", "Worktrees", 2)}
  <div class="srow">sample <span class="meta">main worktree</span></div>
  <div class="srow">hotfix/wt-demo <span class="meta">clean</span></div>
</aside>`;
document.body.insertAdjacentHTML("afterbegin", `<div class="app">${YF.tabs()}${YF.command({ crumb: ["sample", "main worktree", "main"] })}${YF.strip({ banner })}<div class="main">${sidebar}${YF.graphPanel()}${inspector}</div>${YF.activity({ command: "git merge origin/main", duration: "0.3 s", action: "" })}</div>`);
document.body.classList.add("op");
YF.boot("screen 7 · merge conflict");
YF.mountGraph({ hovered: -1, conflict: "Conflicts: 1 · resolve README.md to continue the merge" });

const checkedOut = document.querySelector(".label.active");
checkedOut.classList.remove("active");
checkedOut.querySelector("svg").remove();
const mainLabel = document.querySelector(".row.merge .label");
mainLabel.classList.add("active");
mainLabel.insertAdjacentHTML("afterbegin", YF.icon.check);
document.querySelector(".row.conflict .msg").insertAdjacentHTML("afterbegin", '<span class="st st-C">!</span>');
</script>
</body>
</html>
