<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YForge specimen · 20 composer with Generate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../specimen.css">
<style>
.stg { min-height: 166px; }
.frow.hov { background: var(--fill-hover); }
.frow .muted { color: var(--muted); }
.badge.partial { display: flex; align-items: center; justify-content: center; white-space: nowrap; font-size: 11px; letter-spacing: -0.02em; }
.badge.partial .half { color: var(--text); }
.input.area.filled { color: var(--text); }
.composer .check { padding: 2px 0; }
.composer .note { display: grid; gap: 4px; justify-items: start; padding: 8px 10px; border-radius: var(--r-md); background: var(--attention-tint); color: var(--yellow-strong); font: 400 12px/16px var(--sans); }
.composer .note .btn { color: var(--text); }
</style>
</head>
<body>
<script src="../specimen.js"></script>
<script>
const I = YF.icon;
const strip = YF.strip({ chips: `${YF.headChip()}<span class="chip">${YF.glyph("changes")}Changes <span class="st st-M">M 2</span> <span class="st st-U">U 1</span></span><span class="chip ok">${YF.glyph("check")}fetched 2 min ago</span>` });
const inspector = `<aside class="panel inspector" aria-label="Changes">
  <div class="ihead"><h2>${YF.glyph("changes")}Changes</h2><p>on <span class="ref">feature/greeting</span> · 2 files staged</p></div>
  <div class="ilist">
    <div class="stg">
      ${YF.lhead("check", "Staged (2)", { icon: "minus", label: "Unstage all" })}
      <div class="frow"><span class="badge st-M">M</span><span><span class="muted">src/</span>config.js</span></div>
      <div class="frow"><span class="badge st-M">M</span><span><span class="muted">src/</span>util.js</span></div>
    </div>
  </div>
  <div class="composer">
    <div class="input"><span>Tune retries and clamp helper</span><span class="count">43</span></div>
    <div class="input area filled">Raise the default retry count and clamp the helper result to its min and max.</div>
    <span class="check"><i></i>Amend last commit</span>
    <div class="note" role="status"><span>Draft from your staged changes. Review and edit it; nothing is committed until you commit.</span><span>Withheld from the provider because they look like secrets: .env.local</span><span>The summary was shortened to fit the 72 character guide.</span><span class="btn sm">${YF.glyph("undo", 14)}Restore my text</span></div>
    <div class="hrow"><span class="btn">${YF.glyph("wand")}Generate</span><span class="split" id="split"><span class="btn primary">${YF.glyph("commit")}Commit 2 files <span class="k">⌘↵</span></span><span class="btn primary" aria-label="More commit actions">${I.chevron}</span></span></div>
  </div>
</aside>`;
const overlays = "";
document.body.insertAdjacentHTML("afterbegin", `<div class="app">${YF.tabs()}${YF.command()}${strip}<div class="main">${YF.sidebar()}${YF.graphPanel()}${inspector}</div>${YF.activity()}</div>` + overlays);
YF.boot("screen 20 · composer with Generate");
YF.mountGraph({ selected: 0, hovered: 0 });
document.querySelector(".sidebar .sec .n").textContent = "3";
document.querySelector(".row.wip .sum").textContent = "Changes: 2 modified, 1 untracked";
</script>
</body>
</html>
