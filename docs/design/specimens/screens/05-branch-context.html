<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YForge specimen · branch context actions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../specimen.css">
<style>
.menu .r { font: 400 12px/16px var(--mono); }
.menu .item .mode { min-width: 44px; }
.menu .item .sub { font-size: 12px; }
.menu .item.danger .desc { color: var(--muted); }
.menu .title { padding: 6px 10px 4px; font: 500 12px/16px var(--sans); color: var(--muted); }
.menu .title .r { color: var(--text); }
</style>
</head>
<body>
<script src="../specimen.js"></script>
<script>
const r = name => `<span class="r">${name}</span>`;
const ctx = `<div class="menu" id="ctx" style="width: 440px">
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("check")}</span><span>Checkout ${r("feature/greeting")}</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("merge")}</span><span>Merge ${r("feature/greeting")} into ${r("main")}</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon"></span><span>Rebase ${r("feature/greeting")} onto ${r("main")}</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon"></span><span>Fast-forward ${r("main")} to ${r("feature/greeting")}</span></span></div>
  <div class="sep"></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("branch")}</span><span>Create branch here…</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("worktree")}</span><span>Create worktree from ${r("feature/greeting")}…</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("tag")}</span><span>Create tag here…</span></span></div>
  <div class="sep"></div>
  <div class="item sel" id="reset"><span class="item-main"><span class="item-icon"></span><span>Reset ${r("feature/greeting")}</span></span><span class="sub">▸</span></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("edit")}</span><span>Edit commit message</span></span></div>
  <div class="sep"></div>
  <div class="item"><span class="item-main"><span class="item-icon"></span><span>Set upstream of ${r("feature/greeting")}…</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon"></span><span>Unset upstream of ${r("feature/greeting")}</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("push")}</span><span>Push ${r("feature/greeting")} to…</span></span></div>
  <div class="sep"></div>
  <div class="item danger"><span class="item-main"><span class="item-icon">${YF.glyph("trash")}</span><span>Delete ${r("feature/greeting")}…</span></span></div>
  <div class="item danger"><span class="item-main"><span class="item-icon">${YF.glyph("trash")}</span><span>Delete ${r("origin/feature/greeting")}…</span></span></div>
  <div class="item danger"><span class="item-main"><span class="item-icon">${YF.glyph("trash")}</span><span>Delete ${r("feature/greeting")} and ${r("origin/feature/greeting")}…</span></span></div>
  <div class="sep"></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("copy")}</span><span>Copy</span></span><span class="sub">▸</span></div>
  <div class="sep"></div>
  <div class="item"><span class="item-main"><span class="item-icon"></span><span>Hide in graph</span></span></div>
</div>`;
const reset = `<div class="menu" id="resetmenu" style="width: 300px">
  <div class="item"><span class="item-main"><span class="item-icon"></span><span class="mode">Soft</span></span><span class="desc">keep changes staged</span></div>
  <div class="item"><span class="item-main"><span class="item-icon"></span><span class="mode">Mixed</span></span><span class="desc">keep changes unstaged</span></div>
  <div class="sep"></div>
  <div class="item danger"><span class="item-main"><span class="item-icon"></span><span class="mode">Hard</span></span><span class="desc">discard changes</span></div>
</div>`;
const drop = `<div class="menu" id="drop" style="width: 300px">
  <div class="title">Drop ${r("feature/greeting")} on ${r("main")}</div>
  <div class="item sel"><span class="item-main"><span class="item-icon"></span><span>Fast-forward ${r("main")} by 3 commits</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon">${YF.glyph("merge")}</span><span>Merge ${r("feature/greeting")} into ${r("main")}</span></span></div>
  <div class="item"><span class="item-main"><span class="item-icon"></span><span>Rebase ${r("feature/greeting")} onto ${r("main")}</span></span></div>
</div>`;
const multi = `<div class="menu" id="multi" style="width: 300px">
  <div class="title">3 commits selected</div>
  <div class="item off"><span class="item-main"><span class="item-icon"></span><span>Cherry-pick 5e1a9c2 onto ${r("main")}</span></span></div>
  <div class="item off"><span class="item-main"><span class="item-icon">${YF.glyph("branch")}</span><span>Create branch here…</span></span><span class="kbd">⌘B</span></div>
  <div class="item off"><span class="item-main"><span class="item-icon"></span><span>Reset ${r("main")} to 5e1a9c2</span></span></div>
  <div class="title">Select a single commit</div>
</div>`;
const inspector = `<aside class="panel inspector" aria-label="Changes">
  <div class="ihead"><h2>${YF.glyph("changes")}Changes</h2><p>on <span class="ref">feature/greeting</span> · 2 files</p></div>
  <div class="ilist">
    ${YF.lhead("changes", "Unstaged (2)", { icon: "plus", label: "Stage all" })}
    <div class="frow"><span class="badge st-M">M</span><span>README.md</span></div>
    <div class="frow"><span class="badge st-U">U</span><span>scratch.txt</span></div>
    ${YF.lhead("check", "Staged (0)")}
    <div class="empty">Nothing staged. Stage files, hunks, or lines to commit them.</div>
  </div>
  <div class="composer">
    <div class="input"><span>Summary</span><span class="count">72</span></div>
    <div class="input area">Description</div>
    <div class="hrow"><span class="btn primary">${YF.glyph("commit")}Commit 2 files</span><span class="spacer"></span><span class="btn">Amend</span></div>
  </div>
</aside>`;
document.body.insertAdjacentHTML("afterbegin", `<div class="app">${YF.tabs()}${YF.command()}${YF.strip()}<div class="main">${YF.sidebar()}${YF.graphPanel()}${inspector}</div>${YF.activity()}</div>` + ctx + reset + drop + multi);
YF.boot("screen 5 · branch context actions (context menu and drop menu shown together)");
YF.mountGraph({ selected: 0, hovered: 1 });
const label = document.getElementById("gbody").children[2].querySelector(".label").getBoundingClientRect();
const ctxEl = document.getElementById("ctx");
ctxEl.style.left = `${label.left}px`;
ctxEl.style.top = `${Math.max(8, Math.min(label.bottom + 4, innerHeight - ctxEl.offsetHeight - 8))}px`;
const ctxRect = ctxEl.getBoundingClientRect();
const resetRect = document.getElementById("reset").getBoundingClientRect();
const resetEl = document.getElementById("resetmenu");
resetEl.style.left = `${ctxRect.right + 4}px`;
resetEl.style.top = `${resetRect.top - 7}px`;
const dropEl = document.getElementById("drop");
dropEl.style.left = `${ctxRect.right + 20}px`;
const multiEl = document.getElementById("multi");
multiEl.style.left = `${ctxRect.right + 20}px`;
multiEl.style.top = `${document.getElementById("gbody").children[10].getBoundingClientRect().top}px`;
dropEl.style.top = `${document.getElementById("gbody").children[5].getBoundingClientRect().top}px`;
</script>
</body>
</html>
