[package]
name = "yforge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.8.0"
yforge-ai = { version = "0.1.0", path = "../../crates/yforge-ai" }
yforge-core = { version = "0.1.0", path = "../../crates/yforge-core" }

[dev-dependencies]
tauri = { version = "2.11.6", features = ["test"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
