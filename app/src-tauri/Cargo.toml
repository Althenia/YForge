[package]
name = "yforge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "YForge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
percent-encoding = "2.3.2"
shlex = "2.0.1"
tauri = { version = "2.11.6", features = [] }
uuid = { version = "1.20.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-single-instance = "2.5.1"
tauri-plugin-updater = "2.13.1"
yforge-ai = { version = "0.3.1", path = "../../crates/yforge-ai" }
yforge-core = { version = "0.3.1", path = "../../crates/yforge-core" }
yforge-platform = { version = "0.3.1", path = "../../crates/yforge-platform" }

[dev-dependencies]
tauri = { version = "2.11.6", features = ["test"] }
tempfile = "3.27.0"
